interface:
  display_name: "Using My Precious"
  short_description: "Search private agent session archives"
  default_prompt: "Use $using-my-precious to request memory_recall_context_package via search_memory.py --retrieval-mode hybrid_v1 --depth evidence --context-json before answering; use answerability.status, answer only from supported active/current hits, and abstain when unsupported. Hybrid retrieval may add FTS or local semantic candidates but never bypasses scope, lifecycle, summary, evidence, or query-support checks. Apply current-turn format instructions first; when a supported preference calls for a copyable goal, return only the complete artifact in one collision-free text fence."
